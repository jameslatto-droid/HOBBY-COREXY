#####################################################################
# Hardware Configuration
# MCU, Board Pins, Steppers, and Drivers
#####################################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_4E0032001750563641353820-if00

[mcu rpi]
serial: /tmp/klipper_host_mcu

[board_pins]
aliases:
    EXP1_1=PG4, EXP1_3=PD11, EXP1_5=PG2, EXP1_7=PG6, EXP1_9=<GND>,
    EXP1_2=PA8, EXP1_4=PD10, EXP1_6=PG3, EXP1_8=PG7, EXP1_10=<5V>,
    EXP2_1=PB14, EXP2_3=PG10, EXP2_5=PF11, EXP2_7=PF12,  EXP2_9=<GND>,
    EXP2_2=PB13, EXP2_4=PB12, EXP2_6=PB15, EXP2_8=<RST>, EXP2_10=PF13

#####################################################################
# X/Y Stepper Settings
#####################################################################

[stepper_x]
step_pin: PE9
dir_pin: !PF1
enable_pin: !PF2
endstop_pin: PE15
microsteps: 32
# 20T GT2 pulley x 2mm pitch = 40mm exactly. Reverted from 39.77 on
# 2026-09-20: that value came from measuring a printed part, which is a flow
# error, not a steps-per-mm error. Fix dimensional error with the slicer's
# xy_size_compensation instead. See Rotation_Distance.md.
rotation_distance: 40
full_steps_per_rotation: 200
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC13
run_current: 1.1
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: True
driver_TBL: 2
driver_TOFF: 3

[stepper_y]
step_pin: PE11
dir_pin: !PE8
enable_pin: !PD7
endstop_pin: PE10
microsteps: 32
# 20T GT2 pulley x 2mm pitch = 40mm exactly. Reverted from 39.77 on
# 2026-09-20: that value came from measuring a printed part, which is a flow
# error, not a steps-per-mm error. Fix dimensional error with the slicer's
# xy_size_compensation instead. See Rotation_Distance.md.
rotation_distance: 40
full_steps_per_rotation: 200
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PE3
run_current: 1.1
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: True
driver_TBL: 2
driver_TOFF: 3

#####################################################################
# Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: PE13
# dir_pin/enable_pin swapped 2026-09-20 (see [tmc2209 stepper_z] below): this
# stepper's step_pin is the Z socket's, but dir/enable/uart used to come from
# the E1 socket instead. Motion was unaffected (both Z steppers always move
# together, and neither dir_pin is inverted), but DUMP_TMC/driver diagnostics
# for "stepper_z" were reading the E1 driver. Now all four pins are the Z
# socket's, per Klipper's generic-bigtreetech-skr-pro.cfg.
dir_pin: PC2
enable_pin: !PC0
microsteps: 128
# 4mm lead screw with the 3:1 reduction below = 4 exactly. Reverted from
# 4.018 on 2026-09-20 for the same reason as X/Y.
rotation_distance: 4
full_steps_per_rotation: 200
gear_ratio: 3:1
# THIS is the first-layer height datum on this machine, not the BLTouch
# z_offset - Z homes to the physical switch on PG8 (and PG5 for stepper_z1),
# so PROBE_CALIBRATE cannot move the nozzle datum. Use Z_ENDSTOP_CALIBRATE
# (wrapped as CAL_Z_ENDSTOP in calibration.cfg) instead.
#
# To bake in a babystep: run Z_OFFSET_APPLY_ENDSTOP, read the position_endstop
# value Klipper prints, and hand-edit it below. Do NOT run SAVE_CONFIG for it -
# configfile.py's _disallow_include_conflicts() raises
#   "SAVE_CONFIG section 'stepper_z' option 'position_endstop' conflicts with
#    included value"
# because this line lives in an [include]d file. And do NOT comment this line
# out to dodge that: position_endstop is a required parameter for the Z stepper
# on cartesian-style kinematics, so Klipper will refuse to start without it.
position_endstop: 0
position_max: 400
homing_speed: 5
position_min: -2
endstop_pin: PG8

[tmc2209 stepper_z]
uart_pin: PE1
run_current: 1.1
hold_current: 0.8
sense_resistor: 0.110
# 0 = spreadCycle. Was 1000, which meant stealthChop for every Z move (max
# Z velocity is 15mm/s) and threw away the accuracy that interpolate:False plus
# microsteps:128 was chosen for. A mid-range threshold also makes the driver
# switch mode mid-move, which TMC_Drivers.md warns against.
stealthchop_threshold: 0
interpolate: False
driver_TBL: 2
driver_TOFF: 3

[stepper_z1]
step_pin: PD15
dir_pin: PE7
enable_pin: !PA3
microsteps: 128
# 4mm lead screw with the 3:1 reduction below = 4 exactly. Reverted from
# 4.018 on 2026-09-20 for the same reason as X/Y.
rotation_distance: 4
full_steps_per_rotation: 200
gear_ratio: 3:1
endstop_pin: PG5


[tmc2209 stepper_z1]
uart_pin: PD1
run_current: 1.1
hold_current: 0.8
sense_resistor: 0.110
# 0 = spreadCycle. Was 1000, which meant stealthChop for every Z move (max
# Z velocity is 15mm/s) and threw away the accuracy that interpolate:False plus
# microsteps:128 was chosen for. A mid-range threshold also makes the driver
# switch mode mid-move, which TMC_Drivers.md warns against.
stealthchop_threshold: 0
interpolate: False
driver_TBL: 2
driver_TOFF: 3

#####################################################################
# Extruder Driver (E0 socket) - INTENTIONALLY NOT CONFIGURED, see below
#
# uart_pin PD4 is confirmed correct - it is E0_UART in both Klipper's official
# generic-bigtreetech-skr-pro.cfg and BTT's SKR-PRO-V1.2 schematic.
#
# 2026-09-20: tested [tmc2209 extruder] with uart_pin: PD4 live, remotely,
# sweeping uart_address 0 (implicit default), 1, 2 and 3 in turn (restart +
# DUMP_TMC STEPPER=extruder after each, no extruder motor movement - DUMP_TMC
# reads registers directly with no stepper-enable step, so this cannot trigger
# invoke_shutdown even on failure). ALL FOUR addresses failed identically:
#   "Unable to read tmc uart 'extruder' register GCONF"
# GCONF is one of the first registers any read touches, so this is a
# completely absent link, not a wrong node address - the uart_address
# hypothesis is falsified. Reverted rather than left in place: if this section
# stayed active, the *next* time the extruder motor is enabled (any print's
# purge line, a manual extrude), Klipper's periodic driver check would detect
# the dead link and invoke_shutdown() - reproducing the original fault this
# was meant to fix.
#
# Next step is physical, at the machine (mains AND USB power off first, USB
# back-powers the MCU):
#   1. Pull the E0 driver module. Compare its jumper field against a working
#      socket (X or Y): confirm the UART-enable jumper is fitted (BTT: "When
#      using UART mode, you need to short the needle in the red box with a
#      jumper cap... the 4th Pin from the top"), and that no MS1/MS2 jumpers
#      are fitted (those select node address in UART mode - remove both to
#      match X/Y/Z which build clean at implicit address 0).
#   2. Check the module's UART select resistor is in the factory position
#      (BTT TMC2209 docs: "the factory has connected the UART Pin to the
#      fourth Pin, namely the PDN_UART Pin").
#   3. Check the module is actually a TMC2209, not a TMC2208 (would need
#      [tmc2208 extruder] instead) - check the chip marking.
#   4. While it's out: check whether its DIAG pin is cut. Per hardware.cfg's
#      note above [stepper_x], PE15 (X's endstop) is also E0's DIAG line.
#   5. If all of the above look correct, swap the E0 module with the proven-
#      working Z module and retest. If the fault follows the module, it's
#      dead (documented outcome in two similar SKR Pro reports); if it stays
#      with the E0 socket, it's a board/trace fault.
#
# Once a working link is confirmed via DUMP_TMC (still no motor movement),
# re-add a [tmc2209 extruder] section here with the pin/address that worked.
# Do NOT add tx_pin - the SKR Pro UART is single-wire.
#####################################################################
