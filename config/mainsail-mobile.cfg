# Generated by COREXY Mainsail Mobile Pendant installer.
# Wrappers expose existing Klipper calibration commands only.
# No SAVE_CONFIG, restart, or individual Z-motor control.
# Bed meshing uses the shared heat/home procedure without a timed soak.
# LED status is coordinated with the same controller used by desktop macros.

[gcode_macro MOBILE_PROBE_ACCURACY]
description: Mobile pendant: Probe Accuracy
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        {action_raise_error("Home XYZ before Probe Accuracy")}
    {% endif %}
    _LED_STATUS STATE=PROBING
    PROBE_ACCURACY
    _LED_STATUS STATE=READY

[gcode_macro MOBILE_BED_MESH_CALIBRATE]
description: Mobile pendant: Heated Bed Mesh without timed soak (set heater targets first)
gcode:
    BED_MESH_CALIBRATE

[gcode_macro MOBILE_BED_MESH_CLEAR]
description: Mobile pendant: Bed Mesh Clear
gcode:
    BED_MESH_CLEAR

[gcode_macro MOBILE_SCREWS_TILT_CALCULATE]
description: Mobile pendant: Screws Tilt Calculate
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        {action_raise_error("Home XYZ before Screws Tilt")}
    {% endif %}
    _LED_STATUS STATE=PROBING
    SCREWS_TILT_CALCULATE
    _LED_STATUS STATE=READY
