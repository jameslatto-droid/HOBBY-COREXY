#####################################################################
# Probe, Bed Mesh, and Leveling - LENIENT MODE
#####################################################################

[safe_z_home]
home_xy_position: 30,30
speed: 100
z_hop: 5
z_hop_speed: 4

[bltouch]
sensor_pin: ^PA2
control_pin: PA1
stow_on_each_sample: true
samples: 3
speed: 5
lift_speed: 4
# 0.680 is Klipper's default. Was 0.4, which may not give the pin time to
# finish travelling - the most likely cause of the probe scatter that
# samples_tolerance_retries: 6 was masking.
pin_move_time: 0.680
sample_retract_dist: 5
samples_tolerance: 0.050
samples_tolerance_retries: 6
y_offset: -20
x_offset: -27

[bed_mesh]
speed: 150
horizontal_move_z: 10
mesh_min: 35,35
mesh_max: 270,270
probe_count: 7,7
fade_start: 1.0
fade_end: 10.0
# Klipper: "If a user wishes to enable fade, a value of 10.0 is recommended."
# fade_target: 0 converges on the Z homing position rather than the mesh
# average (measured mesh mean is +0.0002mm, so this is near-cosmetic here).
fade_target: 0
mesh_pps: 2,2
algorithm: bicubic
bicubic_tension: 0.2
zero_reference_position: 150,150
# Adaptive margin for BED_MESH_CALIBRATE ADAPTIVE=1, called from START_PRINT.
# This bed measured 0.104mm total variance across the last full mesh (max 0.2mm
# layer height), well inside Klipper's documented criterion for adaptive mode
# ("machines that can normally probe the entire bed and achieve a maximum
# variance less than or equal to 1 layer height"). Requires exclude_object-style
# markers in the gcode, which gcode_label_objects now provides - see advanced.cfg.
adaptive_margin: 5

[bed_screws]
screw1: 30,30
screw2: 270,30
screw3: 270,270
screw4: 30,270

# NOTE: these are NOZZLE coordinates, and they deliberately include the probe
# offset (+27,+20) on top of the real screw positions in [bed_screws] above.
# screws_tilt_adjust does NOT apply probe offsets (screws_tilt_adjust.py never
# calls use_xy_offsets), unlike [bed_mesh] which does. So 30,30 + (27,20) =
# 57,50 puts the PROBE over the screw. This looks wrong at a glance; it is not.
[screws_tilt_adjust]
screw1: 57,50
screw1_name: front left screw
screw2: 297,50
screw2_name: front right screw
screw3: 297,290
screw3_name: rear right screw
screw4: 57,290
screw4_name: rear left screw
horizontal_move_z: 10
speed: 100
screw_thread: CW-M3

#####################################################################
# Z-Tilt Adjustment - DELIBERATELY DISABLED, DO NOT RE-ENABLE
#
# stepper_z (endstop PG8) and stepper_z1 (endstop PG5) each have their own
# endstop, so Klipper homes them independently and the gantry self-levels on
# every G28. z_tilt would fight that mechanism - which is what the original
# "causing gantry issues" note was describing.
# See Config_Reference [stepper_z1]: "If an endstop_pin is defined for the
# additional stepper then the stepper will home until the endstop is
# triggered."
#####################################################################

# [z_tilt]
# # Z motor positions
# z_positions:
#     30,300      # Left Z motor
#     270,300     # Right Z motor
# 
# # Probe points
# points:
#     57,280      # Left side
#     270,280     # Right side
# 
# speed: 100
# horizontal_move_z: 10
# retries: 15
# retry_tolerance: 0.300
