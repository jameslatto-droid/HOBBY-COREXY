#####################################################################
# Tuning and Performance Settings
#####################################################################

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0

[input_shaper]
# Re-measured 2026-09-13 via ADXL345 TEST_RESONANCES after XY belt retensioning (mzv, 0.0% vibrations both axes)
#
# BEFORE re-running SHAPER_CALIBRATE: comment out the four shaper_* lines
# below, FIRMWARE_RESTART, then calibrate. Otherwise SAVE_CONFIG aborts with
#   "SAVE_CONFIG section 'input_shaper' option 'shaper_freq_x' conflicts with
#    included value"
# and the completed resonance run is discarded. Commenting them out is safe
# here (unlike stepper_z's position_endstop): shaper_freq_x/y default to 0,
# which simply disables input shaping until the new values are saved.
shaper_freq_x: 65.0
shaper_type_x: mzv
shaper_freq_y: 46.2
shaper_type_y: mzv

[adxl345]
cs_pin: rpi:None
spi_bus: spidev0.0

[resonance_tester]
accel_chip: adxl345
probe_points:
	150, 150, 20

[firmware_retraction]
retract_length: 0.6
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 30

# Pressure advance is configured in thermistors.cfg's [extruder] section.
# Deliberately not repeated here - it was drifting out of sync (this file and
# printer.cfg both claimed 0.06 while the real value was 0.05).
# Adjust live via: SET_PRESSURE_ADVANCE ADVANCE=<value>
