#####################################################################
# Core Calibration Macros
#
# These are the only user-facing calibration wrappers. They deliberately
# do not auto-home, heat, save, restart, or move an individual Z motor.
# Each wrapper maps directly to the corresponding Klipper calibration
# command and coordinates the printer LEDs while that operation runs.
#####################################################################

# THIS is the one that sets first-layer height on this machine. Z homes to a
# physical endstop switch, so the nozzle datum is [stepper_z] position_endstop,
# not the BLTouch z_offset. See the comment in hardware.cfg for how to persist
# the result (SAVE_CONFIG will not do it).
[gcode_macro CAL_Z_ENDSTOP]
description: Z Endstop Calibrate (Z_ENDSTOP_CALIBRATE) - sets first-layer height
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        {action_raise_error("Home XYZ before Z Endstop Calibrate")}
    {% endif %}
    _LED_STATUS STATE=CALIBRATING
    Z_ENDSTOP_CALIBRATE

# Calibrates the BLTouch trigger point relative to the nozzle. Used by bed mesh
# and PROBE, but does NOT change first-layer height here - use CAL_Z_ENDSTOP.
[gcode_macro CAL_Z_OFFSET]
description: Z Probe Calibrate (PROBE_CALIBRATE) - probe offset only, not first layer
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        {action_raise_error("Home XYZ before Z Probe Calibrate")}
    {% endif %}
    _LED_STATUS STATE=CALIBRATING
    PROBE_CALIBRATE

[gcode_macro CAL_SCREWS_TILT]
description: Screws Tilt (SCREWS_TILT_CALCULATE)
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        {action_raise_error("Home XYZ before Screws Tilt")}
    {% endif %}
    _LED_STATUS STATE=PROBING
    SCREWS_TILT_CALCULATE
    _LED_STATUS STATE=READY

[gcode_macro CAL_BED_MESH]
description: Bed Mesh (BED_MESH_CALIBRATE)
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        {action_raise_error("Home XYZ before Bed Mesh")}
    {% endif %}
    _LED_STATUS STATE=PROBING
    BED_MESH_CALIBRATE
    _LED_STATUS STATE=READY

[gcode_macro CAL_SAVE]
description: Save calibration and restart Klipper
gcode:
    SAVE_CONFIG
