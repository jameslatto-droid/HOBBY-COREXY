#####################################################################
# System and Utility Settings
#####################################################################

[force_move]
enable_force_move: False

[pause_resume]

# NOTE: Klipper's M84/M18 ignore any axis arguments. stepper_enable.py's
# cmd_M18 calls motor_off(), which disables EVERY stepper and then calls
# clear_homing_state("xyz"). "M84 X Y E" therefore also dropped Z and wiped
# the homed state. Use SET_STEPPER_ENABLE to act on individual steppers.
[idle_timeout]
timeout: 1800
gcode:
    {% if printer.pause_resume.is_paused %}
        # Paused: keep every stepper energised. Disabling any of them clears
        # the homed state, which makes the paused print unresumable.
        # (To also drop the extruder here, add:
        #  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0 - that one is safe,
        #  it does not clear homing state and Klipper re-enables on move.)
        RESPOND TYPE=echo MSG="Idle timeout while paused: steppers left enabled"
    {% else %}
        TURN_OFF_HEATERS
        # Disable X/Y/E individually, leaving stepper_z and stepper_z1
        # energised to prevent gantry creep. Note this holds ~0.8A per Z
        # motor indefinitely; if driver temperature becomes a concern,
        # disable the Z steppers here too.
        SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
        SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
        SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    {% endif %}

[virtual_sdcard]
path: /home/pi/printer_data/gcodes

[display_status]

[respond]

# Neopixel LEDs
[neopixel top_lights]
pin: PD5
chain_count: 60
