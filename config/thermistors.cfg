#####################################################################
# Temperature Sensors and Heaters
#####################################################################

[extruder]
step_pin: PE14
dir_pin: !PA0
enable_pin: !PC3
rotation_distance: 26.5475     # Recalibrated 2026-09-20 after extruder parts remade to fix slippage: 2x tests, ratios 1.366/1.36535 (tight agreement)
gear_ratio: 50:17               # BMG Gear Ratio
microsteps: 16
full_steps_per_rotation: 200    # 200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.4
filament_diameter: 1.750
max_extrude_only_distance: 200
max_extrude_only_velocity: 60
max_extrude_only_accel: 2000
# Placeholder pending real PA calibration; synced with slicer's start_filament_gcode
pressure_advance: 0.05
pressure_advance_smooth_time: 0.040
heater_pin: PB1                 # Heater0
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF4                 # T0
min_extrude_temp: 160
min_temp: 0
max_temp: 280

[heater_bed]
heater_pin: PD12
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF3                 # T0 header (per Klipper's generic-bigtreetech-skr-pro.cfg)
# min_temp raised from -50 on 2026-09-20. -50C is far below anything a working
# NTC reports, which left the low-side disconnected-thermistor shutdown for the
# bed effectively disabled. Klipper: "Set this range just wide enough so that
# reasonable temperatures do not result in an error."
min_temp: 0
max_temp: 110

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100
