## menu conf

#####################################################################
# Display
#####################################################################

# Fysetc Mini 12864 LCD Display
[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
contrast: 63
encoder_pins: ^EXP2_5, ^EXP2_3
# Increase from 2 to 4: one menu entry per physical encoder detent (user reports skipping).
encoder_steps_per_detent: 4
menu_reverse_navigation: False
click_pin: ^!EXP1_2
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2
menu_timeout: 60

# Klipper display_status and print_stats are supported state objects.
# The previous START_PRINT.value and M73 macro fields were not defined.
# Time below is elapsed printing duration (not an estimated remaining time).
[display_data _default_16x4 print_progress]
position: 2, 0
text:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { "{:^10.0%}".format(printer.display_status.progress) }
    {% else %}
        ----------
    {% endif %}

[display_data _default_16x4 progress_bar]
position: 2, 1
text:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { draw_progress_bar(2, 0, 9, printer.display_status.progress) }
    {% endif %}

[display_data _default_16x4 printing_time]
position: 2, 10
text:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { "%02d:%02d" % ((printer.print_stats.print_duration|int // 3600), (printer.print_stats.print_duration|int // 60) % 60) }
    {% endif %}

#####################################################################
# Dynamic RGB LED Effects
#####################################################################

# Neopixel RGB in mini12864 display
[neopixel fysetc_mini12864]
pin: EXP1_6
chain_count: 3
color_order: RGB
initial_RED: 0.0
initial_GREEN: 0.8
initial_BLUE: 1.0

[led_effect LED_Ready]
autostart: true
frame_rate: 24
leds:
    neopixel:fysetc_mini12864
layers:
    static 0 0 top (0.0,0.8,1.0)

[led_effect LED_Heating]
autostart: false
frame_rate: 24
leds:
    neopixel:fysetc_mini12864
layers:
    breathing 2 1 top (1.0,0.3,0.0)

[led_effect LED_Calibrating]
autostart: false
frame_rate: 24
leds:
    neopixel:fysetc_mini12864
layers:
    breathing 3 1 top (0.5,0.0,1.0)

[led_effect LED_Printing]
autostart: false
frame_rate: 24
leds:
    neopixel:fysetc_mini12864
layers:
    static 0 0 top (0.0,1.0,0.0)

[led_effect LED_Paused]
autostart: false
frame_rate: 24
leds:
    neopixel:fysetc_mini12864
layers:
    breathing 4 1 top (1.0,0.35,0.0)

[led_effect LED_FinishPrint]
autostart: false
frame_rate: 24
leds:
    neopixel:fysetc_mini12864
layers:
    strobe 1 1.5 add (1.0,1.0,1.0)
    static 0 0 top (0.0,1.0,0.0)

[led_effect LED_Cancelled]
autostart: false
frame_rate: 24
leds:
    neopixel:fysetc_mini12864
layers:
    breathing 2.5 1 top (1.0,0.0,0.0)

[led_effect LED_Probing]
autostart: false
frame_rate: 24
leds:
    neopixel:fysetc_mini12864
layers:
    breathing 2 1 top (0.0,0.5,1.0)

#####################################################################
# Menu Customization
#####################################################################

[menu __main __octoprint]
type: disabled

#####################################################################
# Calibration Menu
#
# Uses the same safe wrappers as Mainsail: no implicit homing, heating,
# SAVE_CONFIG, restart, or individual Z-motor movement.
#####################################################################

[menu __main __calibration]
type: list
name: Calibration
enable: {not printer.idle_timeout.state == "Printing"}

[menu __main __calibration __zprobe]
type: command
name: Z Probe Calibrate
gcode:
    CAL_Z_OFFSET

[menu __main __calibration __screwstilt]
type: command
name: Screws Tilt
gcode:
    CAL_SCREWS_TILT

[menu __main __calibration __bedmesh]
type: command
name: Bed Mesh
gcode:
    CAL_BED_MESH

[menu __main __calibration __save]
type: command
name: Save Config
gcode:
    CAL_SAVE
