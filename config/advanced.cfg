#####################################################################
# Advanced Klipper Features
#####################################################################

# Exclude objects during print (cancel individual parts)
[exclude_object]

# G-code arc support (G2/G3 commands for smoother curves)
[gcode_arcs]
# Klipper's default. Was 0.1, which re-expanded every arc into 0.1mm segments
# and cancelled out the point of the slicer's arc_fitting = emit_center. The
# slicer's own gcode_resolution = 0.0125 already bounds the path error.
resolution: 1.0

# Skew correction for CoreXY frame alignment
# Run SKEW_PROFILE and CALC_MEASURED_SKEW to calibrate
# Then use SET_SKEW to apply correction
[skew_correction]
