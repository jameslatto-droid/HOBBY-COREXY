#####################################################################
# Core Print / Operator Macros
#####################################################################

[delayed_gcode INIT_PRINTER]
initial_duration: 1
gcode:
    _READY

[gcode_macro _READY]
description: Internal printer-ready state
gcode:
    M117 Printer Ready
    _LED_STATUS STATE=READY

[gcode_macro START_PRINT]
description: Slicer start-print entry point
gcode:
    # Clear any previous offsets and mesh
    SET_GCODE_OFFSET Z=0
    BED_MESH_CLEAR

    {% set BED = params.BED|default(50)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(200)|float %}

    # Heating state starts when heating starts and remains active through
    # homing while the bed/nozzle are still coming to temperature.
    _LED_STATUS STATE=HEATING
    M140 S{BED}

    # Home the printer
    G28

    # Move the nozzle near the bed
    G1 Z5 F3000

    # Load saved bed mesh
    BED_MESH_PROFILE LOAD=default

    # Wait for bed and nozzle to reach temperature
    M190 S{BED}
    G1 Z5 F3000
    M109 S{EXTRUDER}

    # Heating is complete; from this point the printer is actively starting
    # the print (purge line then sliced G-code).
    _LED_STATUS STATE=PRINTING

    # Purge Line G-code
    G92 E0
    G90
    G0 X10 Y10 F6000
    G0 Z0.2
    G91
    G1 X120 E10 F1200
    G1 Y3
    G1 X-120 E6 F1200
    G92 E0
    G90
    G1 Z5.0 F600
    G1 X10 Y10 F1200
    G92 E0
    G1 F9000
    M117 Printing...

[gcode_macro END_PRINT]
description: Slicer end-print entry point
gcode:
    # Turn off heaters and part-cooling fan
    M140 S0
    M104 S0
    M106 S0

    # Retract only (no XY yet)
    G91
    G1 E-3 F300
    G90

    # Lift Z safely, clamped against the machine limit. A bare relative
    # "G1 Z15" errors with "Move out of range" on any print finishing
    # above Z=385, which also breaks CANCEL_PRINT since it calls END_PRINT.
    # Worked in gcode coordinates (and so net of any babystep offset), the
    # same way mainsail.cfg's _TOOLHEAD_PARK_PAUSE_CANCEL does it.
    {% set act_z  = printer.gcode_move.gcode_position.z|float %}
    {% set max_z  = printer.toolhead.axis_maximum.z|float
                    - printer.gcode_move.homing_origin.z|float %}
    {% set z_safe = [act_z + 15.0, max_z]|min %}
    G1 Z{z_safe} F3000

    # Now it's safe to move in XY
    G1 X150 Y150 F6000

    # Disable steppers
    M84

    M117 Finished...
    _LED_STATUS STATE=FINISHED

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
    ##### set defaults #####
    {% set x = params.X|default(295) %}
    {% set y = params.Y|default(295) %}
    {% set z = params.Z|default(10)|float %}
    {% set e = params.E|default(1) %}
    ##### calculate safe lift position #####
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set lift_z = z|abs %}
    {% if act_z < (max_z - lift_z) %}
        {% set z_safe = lift_z %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}

    PAUSE_BASE
    _LED_STATUS STATE=PAUSED

    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G1 E-{e} F2100
    {% else %}
        {action_respond_info("Extruder not hot enough")}
    {% endif %}

    {% if "xyz" in printer.toolhead.homed_axes %}
        G1 Z{z_safe}
        G90
        G1 X{x} Y{y} F6000
    {% else %}
        {action_respond_info("Printer not homed")}
    {% endif %}

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    {% set e = params.E|default(1.5) %}

    {% if 'VELOCITY' in params|upper %}
        {% set get_params = ('VELOCITY=' + params.VELOCITY) %}
    {% else %}
        {% set get_params = "" %}
    {% endif %}

    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G1 E{e} F2100
    {% else %}
        {action_respond_info("Extruder not hot enough")}
    {% endif %}

    _LED_STATUS STATE=PRINTING
    RESUME_BASE {get_params}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    END_PRINT
    _LED_STATUS STATE=CANCELLED
    CANCEL_PRINT_BASE

######################################################################
# Beeper
######################################################################

[output_pin beeper]
pin: PG4
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.0024

[gcode_macro M300]
description: Play a tone
# M300 [P<ms>] [S<Hz>]
gcode:
    {% set S = params.S|default(1000)|int %}
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 }
    G4 P{P}
    SET_PIN PIN=beeper VALUE=0
