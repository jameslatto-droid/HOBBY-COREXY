#####################################################################
# Core Print / Operator Macros
#####################################################################

[delayed_gcode INIT_PRINTER]
initial_duration: 1
gcode:
    _READY

[gcode_macro _READY]
description: Internal printer-ready state
gcode:
    M117 Printer Ready
    _LED_STATUS STATE=READY

[gcode_macro _MESH_POLICY]
# Saved profile remains locked until a new full-bed mesh using X30/Y30
# is measured, saved, independently checked and explicitly accepted.
# After acceptance, an approved edit may set saved_profile_accepted=True.
# Runtime mode selection resets on Klipper restart to the default below.
variable_default_mode: "adaptive"
variable_saved_profile_accepted: False
gcode:

[gcode_macro SELECT_MESH_MODE]
description: Select full/adaptive/saved mesh policy (no motion or heating)
gcode:
    {% set mode = params.MODE|default("")|lower %}
    {% if mode not in ["adaptive", "full", "saved"] %}
        {action_raise_error("Use SELECT_MESH_MODE MODE=adaptive|full|saved")}
    {% endif %}
    {% if printer["gcode_macro _THERMAL_STATE"].active %}
        {action_raise_error("Cannot change mesh policy during startup")}
    {% endif %}
    {% if mode == "saved" %}
        {% if not printer["gcode_macro _MESH_POLICY"].saved_profile_accepted
              or "default" not in printer.bed_mesh.profiles %}
            {action_raise_error("Saved full-bed mesh has not been accepted/installed")}
        {% endif %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_MESH_POLICY VARIABLE=default_mode VALUE='"{mode}"'
    RESPOND MSG="Mesh mode selected: {mode}"

[gcode_macro START_PRINT]
description: Cancellable heat/home/mesh before starting the sliced toolpath
gcode:
    {% set bed = params.BED|default(50)|float %}
    {% set extruder = params.EXTRUDER|default(200)|float %}
    {% set mode = params.MESH|default(printer["gcode_macro _MESH_POLICY"].default_mode)|lower %}
    {% if params.NOZZLE is defined %}
        {% set requested_nozzle = params.NOZZLE|float %}
        {% set actual_config = printer.configfile.settings.extruder.nozzle_diameter|float %}
        {% if (requested_nozzle - actual_config)|abs > 0.001 %}
            {action_raise_error("Nozzle mismatch: G-code specifies " ~ requested_nozzle ~ "mm, Klipper is configured for " ~ actual_config ~ "mm; check actual installed nozzle")}
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG="Slicer omitted NOZZLE; nozzle guard unavailable for this G-code. Update the printer start G-code to pass the NOZZLE parameter."
    {% endif %}
    {% if mode not in ["adaptive", "full", "saved"] %}
        {action_raise_error("Unsupported MESH mode: " ~ mode)}
    {% endif %}
    {% if mode == "saved" %}
        {% if not printer["gcode_macro _MESH_POLICY"].saved_profile_accepted %}
            {action_raise_error("Saved mesh is not approved for X30/Y30 reference; calibrate and accept a new full-bed profile first")}
        {% endif %}
        {% if "default" not in printer.bed_mesh.profiles %}
            {action_raise_error("Approved saved mesh missing: default profile is unavailable")}
        {% endif %}
        _THERMAL_BEGIN MODE=print MESH_MODE=saved BED={bed} EXTRUDER={extruder}
    {% elif mode == "adaptive" and "exclude_object" in printer and printer.exclude_object.objects %}
        _THERMAL_BEGIN MODE=print MESH_MODE=adaptive BED={bed} EXTRUDER={extruder} ADAPTIVE=1
    {% else %}
        _THERMAL_BEGIN MODE=print MESH_MODE=full BED={bed} EXTRUDER={extruder}
    {% endif %}

# The bed mesh probes the outside-mesh reference at X30/Y30, but the
# bed-mesh code does not populate probe.last_probe_position. Purge requires
# an explicit PROBE to obtain that measurement for endpoint height deltas.
# Keep the two off-mesh endpoint probes at Y11.5 until purge is redesigned.
[gcode_macro _THERMAL_START_TOOLPATH]
gcode:
    {% set cfg = printer.configfile.settings %}
    {% set reference = cfg.bed_mesh.zero_reference_position %}
    {% if printer.toolhead.homed_axes != "xyz" %}
        {action_raise_error("Home XYZ before purge probing")}
    {% endif %}
    G90
    M83
    M107
    G1 Z10 F600
    _LED_STATUS STATE=PROBING
    G1 X{reference[0] - cfg.bltouch.x_offset} Y{reference[1] - cfg.bltouch.y_offset} F6000
    PROBE
    _PURGE_REFERENCE_DONE DRY={params.DRY|default(0)|int}

[gcode_macro _PURGE_REFERENCE_DONE]
gcode:
    {% set cfg = printer.configfile.settings %}
    {% set reference = cfg.bed_mesh.zero_reference_position %}
    {% set measured = printer.probe.last_probe_position %}
    {% if (measured.x - reference[0])|abs > 0.05
          or (measured.y - reference[1])|abs > 0.05 %}
        {action_raise_error("Purge reference probe result is not at the mesh reference")}
    {% endif %}
    G1 Z10 F600
    G1 X{10 - cfg.bltouch.x_offset} Y{11.5 - cfg.bltouch.y_offset} F6000
    PROBE
    _PURGE_LEFT_DONE REFERENCE={measured.z} DRY={params.DRY|default(0)|int}

[gcode_macro _PURGE_LEFT_DONE]
gcode:
    {% set cfg = printer.configfile.settings %}
    {% set measured = printer.probe.last_probe_position %}
    {% if (measured.x - 10)|abs > 0.05 or (measured.y - 11.5)|abs > 0.05 %}
        {action_raise_error("Purge left probe result is not at the purge strip")}
    {% endif %}
    {% set left = measured.z - params.REFERENCE|float %}
    G1 Z10 F600
    G1 X{130 - cfg.bltouch.x_offset} Y{11.5 - cfg.bltouch.y_offset} F6000
    PROBE
    _PURGE_RIGHT_DONE REFERENCE={params.REFERENCE} LEFT={left} DRY={params.DRY|default(0)|int}

[gcode_macro _PURGE_RIGHT_DONE]
gcode:
    {% set measured = printer.probe.last_probe_position %}
    {% set left = params.LEFT|float %}
    {% set right = measured.z - params.REFERENCE|float %}
    {% if (measured.x - 130)|abs > 0.05 or (measured.y - 11.5)|abs > 0.05 %}
        {action_raise_error("Purge right probe result is not at the purge strip")}
    {% endif %}
    {% if not (-0.5 <= left <= 0.5) or not (-0.5 <= right <= 0.5) %}
        {action_raise_error("Purge strip differs from the mesh reference by over 0.5mm; inspect bed and probe")}
    {% endif %}
    G1 Z10 F600
    G1 X10 Y11.5 F6000
    G1 Z0.8 F600
    _PURGE_MESH_LEFT LEFT={left} RIGHT={right} DRY={params.DRY|default(0)|int}

[gcode_macro _PURGE_MESH_LEFT]
gcode:
    {% set mesh_left = printer.toolhead.position.z - printer.gcode_move.position.z %}
    G1 Z5 F600
    G1 X130 Y11.5 F6000
    G1 Z0.8 F600
    _PURGE_LINE_LOCAL LEFT={params.LEFT} RIGHT={params.RIGHT} MESH_LEFT={mesh_left} DRY={params.DRY|default(0)|int}

[gcode_macro _PURGE_LINE_LOCAL]
gcode:
    {% set left = params.LEFT|float %}
    {% set right = params.RIGHT|float %}
    {% set mesh_left = params.MESH_LEFT|float %}
    {% set mesh_right = printer.toolhead.position.z - printer.gcode_move.position.z %}
    {% set z_left = 0.2 + left - mesh_left %}
    {% set z_right = 0.2 + right - mesh_right %}
    {% set origin = printer.gcode_move.homing_origin.z %}
    {% if not (-1.0 <= mesh_left <= 1.0) or not (-1.0 <= mesh_right <= 1.0) %}
        {action_raise_error("Mesh correction at the purge strip is over 1mm; inspect the mesh")}
    {% endif %}
    {% if 0.2 + left + origin < printer.toolhead.axis_minimum.z
          or 0.2 + right + origin < printer.toolhead.axis_minimum.z %}
        {action_raise_error("Measured purge height would exceed the Z travel limit")}
    {% endif %}
    RESPOND MSG="Purge bed relative to centre: left={left|round(3)} right={right|round(3)}mm; mesh there left={mesh_left|round(3)} right={mesh_right|round(3)}mm; purge Z left={z_left|round(3)} right={z_right|round(3)}"
    G1 Z5 F600
    {% if params.DRY|default(0)|int %}
        RESPOND MSG="Dry run: purge skipped"
    {% else %}
        _LED_STATUS STATE=PRINTING
        G11
        G92 E0
        G0 X10 Y10 F6000
        G0 Z{z_left} F600
        G1 X130 Y10 Z{z_right} E10 F1200
        G1 Y13
        G1 X10 Y13 Z{z_left} E6 F1200
        G92 E0
        G1 Z5 F600
        G1 X10 Y10 F1200
        G92 E0
        G1 F9000
        M117 Printing...
    {% endif %}

[gcode_macro END_PRINT]
description: Slicer end-print entry point
gcode:
    # Turn off heaters and part-cooling fan
    M140 S0
    M104 S0
    M106 S0

    # Retract only (no XY yet)
    G91
    G1 E-3 F300
    G90

    # Lift Z safely, clamped against the machine limit. A bare relative
    # "G1 Z15" errors with "Move out of range" on any print finishing
    # above Z=385, which also breaks CANCEL_PRINT since it calls END_PRINT.
    # Worked in gcode coordinates (and so net of any babystep offset), the
    # same way mainsail.cfg's _TOOLHEAD_PARK_PAUSE_CANCEL does it.
    {% set act_z  = printer.gcode_move.gcode_position.z|float %}
    {% set max_z  = printer.toolhead.axis_maximum.z|float
                    - printer.gcode_move.homing_origin.z|float %}
    {% set z_safe = [act_z + 15.0, max_z]|min %}
    G1 Z{z_safe} F3000

    # Now it's safe to move in XY
    G1 X150 Y150 F6000

    # Match system.cfg: release X/Y/extruder only after parking.
    # Keep independently supported Z/Z1 motors energised to prevent gantry creep.
    # Never substitute M84/M18 here: Klipper disables all motors.
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0

    M117 Finished...
    _LED_STATUS STATE=FINISHED

# PAUSE / RESUME / CANCEL_PRINT are intentionally NOT defined here.
#
# mainsail.cfg (included first) already provides them, and redefining them here
# silently won: Klipper merges duplicate sections per-option, so the bodies came
# from this file while orphaned variable_* lines survived from mainsail.cfg.
# The overrides also dropped several protections - the idle-timeout extension
# during a pause, nozzle temperature restore on resume, park-height clamping,
# and the pause-at-layer reset on cancel.
#
# Configure the upstream macros through _CLIENT_VARIABLE below instead.

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 295.0
variable_custom_park_y    : 295.0
variable_custom_park_dz   : 2.0
variable_retract          : 1.0
variable_cancel_retract   : 3.0
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 100.0
variable_park_at_cancel   : True
variable_park_at_cancel_x : 150.0
variable_park_at_cancel_y : 150.0
# 4 hours. This is the protection the old override removed: without it the
# 30-minute [idle_timeout] fires mid-pause.
variable_idle_timeout     : 14400
variable_use_fw_retract   : False
variable_user_pause_macro : "_LED_STATUS STATE=PAUSED"
variable_user_resume_macro: "_THERMAL_USER_RESUME"
variable_user_cancel_macro: "_THERMAL_CANCEL"
gcode:

######################################################################
# Thermal preparation: volatile state deliberately resets on restart.
######################################################################

[gcode_macro _THERMAL_STATE]
variable_bed: 0.0
variable_extruder: 0.0
variable_restore_timeout: 1800.0
variable_active: False
variable_stage: "idle"
variable_mode: "mesh"
variable_heat_remaining: 1800
variable_mesh_args: ""
variable_mesh_mode: "full"
gcode:

[gcode_macro _THERMAL_BEGIN]
description: Internal asynchronous temperature preparation
gcode:
    {% set bed = params.BED|float %}
    {% set extruder = params.EXTRUDER|float %}
    {% set state = printer["gcode_macro _THERMAL_STATE"] %}
    {% set limits = printer.configfile.settings %}
    {% set mode = params.MODE|default("mesh") %}
    {% set mesh_mode = params.MESH_MODE|default("full")|lower %}
    {% if mesh_mode not in ["full", "adaptive", "saved"] %}
        {action_raise_error("Unknown startup mesh mode: " ~ mesh_mode)}
    {% endif %}
    {% if mode == "print" and mesh_mode == "saved"
          and not printer["gcode_macro _MESH_POLICY"].saved_profile_accepted %}
        {action_raise_error("Saved mesh not accepted; no print motion permitted")}
    {% endif %}
    {% if state.active %}
        {action_raise_error("Thermal preparation is already running; use CANCEL_PRINT to stop it")}
    {% endif %}
    {% if mode == "print" and not printer.virtual_sdcard.is_active %}
        {action_raise_error("START_PRINT requires a printer-hosted G-code file for safe staged startup")}
    {% endif %}
    {% if mode != "print" and printer.print_stats.state in ["printing", "paused"] %}
        {action_raise_error("Standalone meshing is not allowed during an active print")}
    {% endif %}
    {% if bed <= 0 or bed >= limits.heater_bed.max_temp
          or extruder < limits.extruder.min_extrude_temp
          or extruder >= limits.extruder.max_temp %}
        {action_raise_error("Thermal preparation requires valid printing BED and EXTRUDER temperatures")}
    {% endif %}
    {% if mode == "print" %}
        PAUSE_BASE
        # Reset prior live speed/flow changes before slicer/filament overrides.
        M220 S100
        M221 S100
        # Conservative default for the first layer until sliced feature M204 values take over.
        M204 S500
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_THERMAL_STATE VARIABLE=active VALUE=True
    SET_GCODE_VARIABLE MACRO=_THERMAL_STATE VARIABLE=stage VALUE='"heating"'
    SET_GCODE_VARIABLE MACRO=_THERMAL_STATE VARIABLE=mode VALUE='"{mode}"'
    SET_GCODE_VARIABLE MACRO=_THERMAL_STATE VARIABLE=bed VALUE={bed}
    SET_GCODE_VARIABLE MACRO=_THERMAL_STATE VARIABLE=extruder VALUE={extruder}
    SET_GCODE_VARIABLE MACRO=_THERMAL_STATE VARIABLE=heat_remaining VALUE=1800
    SET_GCODE_VARIABLE MACRO=_THERMAL_STATE VARIABLE=mesh_mode VALUE='"{mesh_mode}"'
    SET_GCODE_VARIABLE MACRO=_THERMAL_STATE VARIABLE=mesh_args VALUE='"{% for key, value in params.items() %}{% if key not in ["BED", "EXTRUDER", "MODE", "MESH_MODE"] %}{key}={value} {% endif %}{% endfor %}"'
    SET_GCODE_VARIABLE MACRO=_THERMAL_STATE VARIABLE=restore_timeout VALUE={printer.idle_timeout.idle_timeout}
    SET_IDLE_TIMEOUT TIMEOUT=7200
    SET_GCODE_OFFSET Z=0
    BED_MESH_CLEAR
    M107
    _LED_STATUS STATE=HEATING
    M140 S{bed}
    M104 S{extruder}
    RESPOND MSG="Heating to bed {bed} / nozzle {extruder}C; then homing and meshing without timed soak. Cancel remains available."
    M117 Heating before mesh
    UPDATE_DELAYED_GCODE ID=_THERMAL_TICK DURATION=1

[delayed_gcode _THERMAL_TICK]
gcode:
    _THERMAL_STEP

[gcode_macro _THERMAL_STEP]
gcode:
    {% set state = printer["gcode_macro _THERMAL_STATE"] %}
    {% set at_initial_temp = printer.heater_bed.temperature >= state.bed
                             and printer.heater_bed.temperature <= state.bed + 2
                             and (printer.extruder.temperature - state.extruder)|abs <= 1 %}
    {% if not state.active %}
        UPDATE_DELAYED_GCODE ID=_THERMAL_TICK DURATION=0
    {% elif printer.heater_bed.target != state.bed
            or printer.extruder.target != state.extruder %}
        _THERMAL_FAIL MSG="Heater targets changed during thermal preparation"
    {% elif state.mode == "print" and (not printer.pause_resume.is_paused
            or printer.print_stats.state != "paused") %}
        _THERMAL_FAIL MSG="Print state changed during thermal preparation"
    {% elif state.stage == "probing" %}
        _THERMAL_FAIL MSG="Homing, meshing or purge did not complete; inspect the console error"
    {% elif state.heat_remaining <= 0 %}
        _THERMAL_FAIL MSG="Heaters did not stabilize within 30 minutes"
    {% elif state.stage == "heating" %}
        {% if at_initial_temp %}
            SET_GCODE_VARIABLE MACRO=_THERMAL_STATE VARIABLE=stage VALUE='"probing"'
            UPDATE_DELAYED_GCODE ID=_THERMAL_TICK DURATION=1
            _THERMAL_PROBE
        {% else %}
            SET_GCODE_VARIABLE MACRO=_THERMAL_STATE VARIABLE=heat_remaining VALUE={state.heat_remaining - 1}
            UPDATE_DELAYED_GCODE ID=_THERMAL_TICK DURATION=1
        {% endif %}
    {% else %}
        _THERMAL_FAIL MSG="Unexpected thermal preparation stage; cancel and restart preparation"
    {% endif %}

[gcode_macro _THERMAL_PROBE]
gcode:
    RESPOND MSG="Temperatures reached; homing and meshing"
    G28
    G90
    G1 Z10 F600
    _LED_STATUS STATE=PROBING
    {% set state = printer["gcode_macro _THERMAL_STATE"] %}
    {% if state.mesh_mode == "saved" %}
        BED_MESH_PROFILE LOAD=default
    {% else %}
        _BED_MESH_CALIBRATE_BASE {state.mesh_args}
    {% endif %}
    _THERMAL_MESH_DONE

[gcode_macro _THERMAL_MESH_DONE]
gcode:
    {% set state = printer["gcode_macro _THERMAL_STATE"] %}
    {% if state.mode == "print" %}
        # Do not traverse the off-mesh purge strip at Y10-13.
        # PrusaSlicer print presets provide two skirt loops for nozzle priming.
        # Keep legacy _THERMAL_START_TOOLPATH and its probe safeguards dormant
        # until the purge geometry and height reference are physically reviewed.
        G90
        M83
        M107
        _LED_STATUS STATE=PRINTING
        RESPOND MSG="Mesh complete; off-mesh purge disabled. Prime nozzle with slicer skirt."
        M117 Printing...
    {% else %}
        G90
        G1 Z10 F600
        M400
        _LED_STATUS STATE=READY
    {% endif %}
    _THERMAL_COMPLETE

[gcode_macro _THERMAL_COMPLETE]
gcode:
    {% set state = printer["gcode_macro _THERMAL_STATE"] %}
    SET_IDLE_TIMEOUT TIMEOUT={state.restore_timeout}
    SET_GCODE_VARIABLE MACRO=_THERMAL_STATE VARIABLE=active VALUE=False
    SET_GCODE_VARIABLE MACRO=_THERMAL_STATE VARIABLE=stage VALUE='"idle"'
    UPDATE_DELAYED_GCODE ID=_THERMAL_TICK DURATION=0
    {% if state.mode == "print" %}
        CLEAR_PAUSE
        M24.1
    {% else %}
        RESPOND MSG="Hot bed mesh complete; ready for inspection or SAVE_CONFIG"
    {% endif %}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_BASE
description: Heat before homing and full/adaptive meshing (no timed soak)
gcode:
    {% set bed = params.BED|default(printer.heater_bed.target)|float %}
    {% set extruder = params.EXTRUDER|default(printer.extruder.target)|float %}
    _THERMAL_BEGIN MODE=mesh BED={bed} EXTRUDER={extruder} {% for key, value in params.items() %}{% if key not in ["BED", "EXTRUDER", "MODE"] %}{key}={value} {% endif %}{% endfor %}

[gcode_macro _THERMAL_USER_RESUME]
gcode:
    {% if printer["gcode_macro _THERMAL_STATE"].active %}
        {action_raise_error("Thermal preparation is still running; wait for automatic continuation or Cancel")}
    {% endif %}
    _LED_STATUS STATE=PRINTING

[gcode_macro M24]
rename_existing: M24.1
gcode:
    {% if printer["gcode_macro _THERMAL_STATE"].active %}
        {action_raise_error("Thermal preparation is still running; manual file resume is blocked")}
    {% endif %}
    M24.1

[gcode_macro _THERMAL_FAIL]
gcode:
    RESPOND TYPE=error MSG="{params.MSG}"
    {% if printer["gcode_macro _THERMAL_STATE"].mode == "print" %}
        CANCEL_PRINT
    {% else %}
        TURN_OFF_HEATERS
        _THERMAL_CANCEL
    {% endif %}

[gcode_macro _THERMAL_CANCEL]
gcode:
    {% if printer["gcode_macro _THERMAL_STATE"].active %}
        SET_IDLE_TIMEOUT TIMEOUT={printer["gcode_macro _THERMAL_STATE"].restore_timeout}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_THERMAL_STATE VARIABLE=active VALUE=False
    SET_GCODE_VARIABLE MACRO=_THERMAL_STATE VARIABLE=stage VALUE='"idle"'
    UPDATE_DELAYED_GCODE ID=_THERMAL_TICK DURATION=0
    _LED_STATUS STATE=CANCELLED

######################################################################
# Beeper
######################################################################

[output_pin beeper]
pin: PG4
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.0024

[gcode_macro M300]
description: Play a tone
# M300 [P<ms>] [S<Hz>]
gcode:
    {% set S = params.S|default(1000)|int %}
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 }
    G4 P{P}
    SET_PIN PIN=beeper VALUE=0
