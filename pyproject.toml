[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hobby-corexy-printer-mcp"
version = "0.1.0"
description = "Read and safely update PrusaSlicer and Klipper configuration over MCP"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "paramiko>=3.5,<5",
]

[project.scripts]
hobby-printer-mcp = "printer_mcp.server:main"

[tool.setuptools.packages.find]
include = ["printer_mcp*"]
